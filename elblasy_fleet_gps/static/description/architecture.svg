<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="Traccar to Odoo Fleet GPS">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="960" height="300" rx="22" fill="#f1f5f9"/>
  <g font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" text-anchor="middle">
    <rect x="30" y="80" width="230" height="140" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="145" y="122" font-size="22" font-weight="700" fill="#0f172a">GPS trackers</text>
    <text x="145" y="152" font-size="15" fill="#475569">cars · trucks · containers</text>
    <text x="145" y="176" font-size="15" fill="#475569">report to your Traccar</text>
    <rect x="365" y="80" width="230" height="140" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="480" y="122" font-size="22" font-weight="700" fill="#0f172a">Traccar</text>
    <text x="480" y="152" font-size="15" fill="#475569">your own server</text>
    <text x="480" y="176" font-size="15" fill="#475569">REST API · forward.url</text>
    <rect x="700" y="60" width="230" height="180" rx="18" fill="url(#g)"/>
    <text x="815" y="108" font-size="22" font-weight="700" fill="#ffffff">Odoo · Fleet GPS</text>
    <text x="815" y="142" font-size="15" fill="#e0f2fe">live map · dashboard</text>
    <text x="815" y="166" font-size="15" fill="#e0f2fe">trips · reports · playback</text>
    <text x="815" y="190" font-size="15" fill="#e0f2fe">linked to every Fleet vehicle</text>
    <path d="M262 150H362" stroke="#475569" stroke-width="3" marker-end="url(#a)" fill="none"/>
    <path d="M598 130H698" stroke="#475569" stroke-width="3" marker-end="url(#a)" fill="none"/>
    <path d="M698 176H598" stroke="#475569" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)" fill="none"/>
    <text x="648" y="116" font-size="13" fill="#334155">push</text>
    <text x="648" y="198" font-size="13" fill="#334155">pull (every 10 s while a map is open)</text>
  </g>
</svg>
